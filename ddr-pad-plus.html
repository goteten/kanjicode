<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>DDR NOTE PAD</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #11151d;
      --panel-2: #171c26;
      --line: #2a3140;
      --ink: #f5f7fb;
      --muted: #8f98aa;
      --accent: #d7ff3f;
      --accent-ink: #101500;
      --arrow: #eef2f8;
      --cell: clamp(54px, 17vw, 78px);
      --lanes: 4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -10%, rgba(215, 255, 63, .12), transparent 35rem),
        var(--bg);
      font-family: Inter, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      padding: clamp(18px, 4vw, 42px) 14px 64px;
    }

    main {
      width: min(580px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 8vw, 48px);
      line-height: .95;
      letter-spacing: -.045em;
    }

    .count {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      width: 132px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }

    .mode-switch button {
      min-height: 34px;
      border: 0;
      padding: 5px 10px;
      color: var(--muted);
      background: transparent;
    }

    .mode-switch button[aria-pressed="true"] {
      color: var(--accent-ink);
      background: var(--accent);
    }

    .discord-settings {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
    }

    .discord-settings h2 {
      margin: 0 0 12px;
      font-size: 14px;
      letter-spacing: .02em;
    }

    .division-switch {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 14px;
    }

    .division-switch button {
      min-height: 36px;
      padding: 6px;
      color: var(--muted);
      background: var(--panel-2);
    }

    .division-switch button[aria-pressed="true"] {
      color: var(--accent-ink);
      border-color: var(--accent);
      background: var(--accent);
    }

    .compact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -3px 0 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .compact-toggle {
      min-height: 34px;
      padding: 5px 11px;
    }

    .compact-toggle[aria-pressed="true"] {
      color: var(--accent-ink);
      border-color: var(--accent);
      background: var(--accent);
    }

    .emoji-set {
      margin: 0 0 12px;
      padding: 9px;
      border: 1px solid transparent;
      border-radius: 10px;
    }

    .emoji-set[hidden] { display: none; }

    .emoji-set[data-tone="red"] {
      border-color: rgba(255, 104, 104, .24);
      background: rgba(255, 84, 84, .07);
    }

    .emoji-set[data-tone="blue"] {
      border-color: rgba(94, 164, 255, .24);
      background: rgba(65, 137, 255, .07);
    }

    .emoji-set[data-tone="green"] {
      border-color: rgba(94, 221, 144, .24);
      background: rgba(57, 196, 111, .07);
    }

    .emoji-set[data-tone="yellow"] {
      border-color: rgba(255, 213, 74, .25);
      background: rgba(255, 205, 43, .07);
    }

    .emoji-set legend {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .emoji-fields {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .blank-field { max-width: calc(25% - 6px); }

    .emoji-field {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .emoji-field input {
      width: 100%;
      min-width: 0;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel-2);
      padding: 7px 8px;
      font: inherit;
      font-size: 13px;
      text-align: center;
    }

    .emoji-field input:focus {
      outline: 3px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: var(--panel-2);
      padding: 8px 13px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { border-color: #505b70; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button.primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
    button.danger { margin-left: auto; color: #ff9c9c; }

    .chart {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .32);
    }

    .labels, .row {
      display: grid;
      grid-template-columns: 36px repeat(var(--lanes), var(--cell));
      justify-content: center;
    }

    .chart.dp {
      --lanes: 8;
      --cell: clamp(38px, 10vw, 62px);
      overflow-x: auto;
    }

    .chart.dp .label:nth-child(6),
    .chart.dp .step:nth-child(6) {
      border-left: 3px solid #596274;
    }

    .labels {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(17, 21, 29, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .label {
      display: grid;
      place-items: center;
      height: 42px;
      color: var(--muted);
      font-size: 21px;
      font-weight: 800;
    }

    .row {
      border-bottom: 1px solid var(--line);
    }

    .row:last-child { border-bottom: 0; }
    .row:nth-child(4n + 1) { border-top: 2px solid #596274; }

    .row[data-tone="red"] .step { background: rgba(255, 84, 84, .055); }
    .row[data-tone="blue"] .step { background: rgba(65, 137, 255, .055); }
    .row[data-tone="green"] .step { background: rgba(57, 196, 111, .055); }
    .row[data-tone="yellow"] .step { background: rgba(255, 205, 43, .055); }

    .row[data-tone="red"] .step[aria-pressed="true"]::after { border-color: rgba(255, 104, 104, .7); }
    .row[data-tone="blue"] .step[aria-pressed="true"]::after { border-color: rgba(94, 164, 255, .7); }
    .row[data-tone="green"] .step[aria-pressed="true"]::after { border-color: rgba(94, 221, 144, .7); }
    .row[data-tone="yellow"] .step[aria-pressed="true"]::after { border-color: rgba(255, 213, 74, .7); }

    .row-number {
      display: grid;
      place-items: center;
      color: #697386;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .step {
      position: relative;
      width: var(--cell);
      height: var(--cell);
      padding: 0;
      border: 0;
      border-left: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: transparent;
      font-size: clamp(36px, 11vw, 52px);
      line-height: 1;
    }

    .step::after {
      content: attr(data-arrow);
      display: grid;
      place-items: center;
      position: absolute;
      inset: 7px;
      border: 1px solid transparent;
      border-radius: 9px;
      opacity: 0;
      transform: scale(.72);
      transition: opacity .1s ease, transform .12s ease;
    }

    .step[aria-pressed="true"]::after {
      color: var(--arrow);
      background: #252c39;
      border-color: #4a5568;
      opacity: 1;
      transform: scale(1);
      text-shadow: 0 2px 12px rgba(255,255,255,.18);
    }

    .step:hover { background: rgba(255,255,255,.025); }
    .step:focus-visible { outline-offset: -4px; }

    .hint {
      margin: 13px 4px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 5;
      translate: -50% 12px;
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--accent-ink);
      background: var(--accent);
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
    }

    .toast.show { opacity: 1; translate: -50% 0; }

    @media (max-width: 410px) {
      body { padding-inline: 8px; }
      .labels, .row { grid-template-columns: 28px repeat(var(--lanes), var(--cell)); }
      .toolbar button { flex: 1; padding-inline: 8px; }
      button.danger { margin-left: 0; }
      .emoji-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .blank-field { max-width: calc(50% - 4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">STEP CHART SKETCH</p>
        <h1>DDR NOTE PAD</h1>
      </div>
      <div>
        <div class="mode-switch" aria-label="プレイスタイル">
          <button type="button" id="modeSp" aria-pressed="true">SP</button>
          <button type="button" id="modeDp" aria-pressed="false">DP</button>
        </div>
        <p class="count"><span id="rowCount">16</span> rows</p>
      </div>
    </header>

    <div class="toolbar" aria-label="譜面の操作">
      <button type="button" id="addRows">＋ 4行</button>
      <button type="button" id="removeRows">− 4行</button>
      <button type="button" class="primary" id="copyChart">譜面をコピー</button>
      <button type="button" id="copyDiscord">Discord用コピー</button>
      <button type="button" id="copyShareUrl">共有URLをコピー</button>
      <button type="button" class="danger" id="clearChart">全消去</button>
    </div>

    <section class="discord-settings" aria-labelledby="discordSettingsTitle">
      <h2 id="discordSettingsTitle">Discord用の置き換え</h2>
      <div class="division-switch" aria-label="音符の細かさ">
        <button type="button" data-division="4" aria-pressed="true">4分</button>
        <button type="button" data-division="8" aria-pressed="false">8分</button>
        <button type="button" data-division="12" aria-pressed="false">12分</button>
        <button type="button" data-division="16" aria-pressed="false">16分</button>
      </div>
      <div class="compact-row">
        <span>行末の空白絵文字を省略</span>
        <button type="button" class="compact-toggle" id="compactCopy" aria-pressed="false">節約モード OFF</button>
      </div>
      <fieldset class="emoji-set" data-emoji-set="a">
        <legend>A：拍の先頭</legend>
        <div class="emoji-fields">
          <label class="emoji-field">←<input id="emojiA0" value=":l_:" aria-label="A 左矢印のDiscord絵文字"></label>
          <label class="emoji-field">↓<input id="emojiA1" value=":d_:" aria-label="A 下矢印のDiscord絵文字"></label>
          <label class="emoji-field">↑<input id="emojiA2" value=":u_:" aria-label="A 上矢印のDiscord絵文字"></label>
          <label class="emoji-field">→<input id="emojiA3" value=":r_:" aria-label="A 右矢印のDiscord絵文字"></label>
        </div>
      </fieldset>
      <fieldset class="emoji-set" data-emoji-set="b" hidden>
        <legend>B：拍の途中</legend>
        <div class="emoji-fields">
          <label class="emoji-field">←<input id="emojiB0" value=":l_:" aria-label="B 左矢印のDiscord絵文字"></label>
          <label class="emoji-field">↓<input id="emojiB1" value=":d_:" aria-label="B 下矢印のDiscord絵文字"></label>
          <label class="emoji-field">↑<input id="emojiB2" value=":u_:" aria-label="B 上矢印のDiscord絵文字"></label>
          <label class="emoji-field">→<input id="emojiB3" value=":r_:" aria-label="B 右矢印のDiscord絵文字"></label>
        </div>
      </fieldset>
      <fieldset class="emoji-set" data-emoji-set="c" hidden>
        <legend>C：拍の中央</legend>
        <div class="emoji-fields">
          <label class="emoji-field">←<input id="emojiC0" value=":l_:" aria-label="C 左矢印のDiscord絵文字"></label>
          <label class="emoji-field">↓<input id="emojiC1" value=":d_:" aria-label="C 下矢印のDiscord絵文字"></label>
          <label class="emoji-field">↑<input id="emojiC2" value=":u_:" aria-label="C 上矢印のDiscord絵文字"></label>
          <label class="emoji-field">→<input id="emojiC3" value=":r_:" aria-label="C 右矢印のDiscord絵文字"></label>
        </div>
      </fieldset>
      <label class="emoji-field blank-field">空白<input id="emojiBlank" value=":air:" aria-label="空白のDiscord絵文字"></label>
    </section>

    <section class="chart" aria-label="DDR譜面">
      <div class="labels" id="labels" aria-hidden="true"></div>
      <div id="grid"></div>
    </section>
    <p class="hint">入力内容はURLに自動保存されます。共有URLを開くと同じ譜面と設定を復元できます。</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const arrows = ["←", "↓", "↑", "→"];
    const divisionPatterns = {
      4: [0],
      8: [0, 1],
      12: [0, 1, 1],
      16: [0, 1, 2, 1]
    };
    const divisionTones = {
      4: [""],
      8: ["red", "blue"],
      12: ["red", "green", "green"],
      16: ["red", "yellow", "blue", "yellow"]
    };
    const grid = document.querySelector("#grid");
    const labels = document.querySelector("#labels");
    const chart = document.querySelector(".chart");
    const rowCount = document.querySelector("#rowCount");
    const toast = document.querySelector("#toast");
    let rows = 16;
    let mode = "sp";
    let division = 4;
    let compactCopy = false;
    let notes = Array.from({ length: rows }, () => Array(8).fill(false));
    let toastTimer;

    function render() {
      grid.replaceChildren();
      labels.replaceChildren();
      labels.append(document.createElement("span"));
      const laneCount = mode === "dp" ? 8 : 4;
      Array.from({ length: laneCount }, (_, index) => {
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = arrows[index % 4];
        labels.append(label);
      });
      chart.classList.toggle("dp", mode === "dp");

      notes.forEach((note, rowIndex) => {
        const row = document.createElement("div");
        row.className = "row";
        const tone = divisionTones[division][rowIndex % divisionTones[division].length];
        if (tone) row.dataset.tone = tone;

        const number = document.createElement("span");
        number.className = "row-number";
        number.textContent = rowIndex + 1;
        row.append(number);

        Array.from({ length: laneCount }, (_, columnIndex) => {
          const arrow = arrows[columnIndex % 4];
          const button = document.createElement("button");
          button.type = "button";
          button.className = "step";
          button.dataset.arrow = arrow;
          button.setAttribute("aria-pressed", String(note[columnIndex]));
          button.setAttribute("aria-label", `${rowIndex + 1}行目 ${arrow}`);
          button.addEventListener("click", () => {
            notes[rowIndex][columnIndex] = !notes[rowIndex][columnIndex];
            button.setAttribute("aria-pressed", String(notes[rowIndex][columnIndex]));
            saveToUrl();
          });
          row.append(button);
        });
        grid.append(row);
      });
      rows = notes.length;
      rowCount.textContent = rows;
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1700);
    }

    document.querySelector("#addRows").addEventListener("click", () => {
      notes.push(...Array.from({ length: 4 }, () => Array(8).fill(false)));
      render();
      saveToUrl();
    });

    document.querySelector("#removeRows").addEventListener("click", () => {
      if (notes.length <= 4) return showToast("これ以上は減らせません");
      notes.splice(-4);
      render();
      saveToUrl();
    });

    document.querySelector("#clearChart").addEventListener("click", () => {
      notes = notes.map(() => Array(8).fill(false));
      render();
      saveToUrl();
      showToast("譜面を消去しました");
    });

    function setMode(nextMode) {
      mode = nextMode;
      document.querySelector("#modeSp").setAttribute("aria-pressed", String(mode === "sp"));
      document.querySelector("#modeDp").setAttribute("aria-pressed", String(mode === "dp"));
      render();
      saveToUrl();
    }

    document.querySelector("#modeSp").addEventListener("click", () => setMode("sp"));
    document.querySelector("#modeDp").addEventListener("click", () => setMode("dp"));

    function setDivision(nextDivision) {
      division = nextDivision;
      document.querySelectorAll("[data-division]").forEach(button => {
        button.setAttribute("aria-pressed", String(Number(button.dataset.division) === division));
      });
      const sets = {
        a: document.querySelector('[data-emoji-set="a"]'),
        b: document.querySelector('[data-emoji-set="b"]'),
        c: document.querySelector('[data-emoji-set="c"]')
      };
      Object.values(sets).forEach(set => set.removeAttribute("data-tone"));
      sets.b.hidden = division === 4;
      sets.c.hidden = division !== 16;

      if (division !== 4) sets.a.dataset.tone = "red";
      if (division === 8) sets.b.dataset.tone = "blue";
      if (division === 12) sets.b.dataset.tone = "green";
      if (division === 16) {
        sets.b.dataset.tone = "yellow";
        sets.c.dataset.tone = "blue";
      }
      render();
      saveToUrl();
    }

    document.querySelectorAll("[data-division]").forEach(button => {
      button.addEventListener("click", () => setDivision(Number(button.dataset.division)));
    });

    function setCompactCopy(enabled) {
      compactCopy = enabled;
      const button = document.querySelector("#compactCopy");
      button.setAttribute("aria-pressed", String(compactCopy));
      button.textContent = `節約モード ${compactCopy ? "ON" : "OFF"}`;
      saveToUrl();
    }

    document.querySelector("#compactCopy").addEventListener("click", () => {
      setCompactCopy(!compactCopy);
    });

    document.querySelectorAll(".emoji-field input").forEach(input => {
      input.addEventListener("input", saveToUrl);
    });

    document.querySelector("#copyChart").addEventListener("click", async () => {
      const laneCount = mode === "dp" ? 8 : 4;
      const lastActive = notes.reduce((last, row, index) => row.slice(0, laneCount).some(Boolean) ? index : last, -1);
      const end = Math.max(lastActive + 1, 4);
      const text = notes.slice(0, end)
        .map(row => row.slice(0, laneCount).map((active, index) => active ? arrows[index % 4] : "　").join(""))
        .join("\n");
      await copyText(text, "譜面をコピーしました");
    });

    document.querySelector("#copyDiscord").addEventListener("click", async () => {
      const replacements = ["A", "B", "C"].map(set =>
        Array.from({ length: 4 }, (_, index) => document.querySelector(`#emoji${set}${index}`).value)
      );
      const blank = document.querySelector("#emojiBlank").value;
      const laneCount = mode === "dp" ? 8 : 4;
      const lastActive = notes.reduce((last, row, index) => row.slice(0, laneCount).some(Boolean) ? index : last, -1);
      const end = Math.max(lastActive + 1, 4);
      const text = notes.slice(0, end)
        .map((row, rowIndex) => {
          const pattern = divisionPatterns[division];
          const set = replacements[pattern[rowIndex % pattern.length]];
          const lanes = row.slice(0, laneCount);
          const outputLength = compactCopy ? lanes.lastIndexOf(true) + 1 : laneCount;
          return lanes.slice(0, outputLength).map((active, index) => active ? set[index % 4] : blank).join("");
        })
        .join("\n");
      await copyText(text, "Discord用の譜面をコピーしました");
    });

    document.querySelector("#copyShareUrl").addEventListener("click", async () => {
      saveToUrl();
      await copyText(location.href, "共有URLをコピーしました");
    });

    function getEmojiValues() {
      return ["A", "B", "C"].flatMap(set =>
        Array.from({ length: 4 }, (_, index) => document.querySelector(`#emoji${set}${index}`).value)
      ).concat(document.querySelector("#emojiBlank").value);
    }

    function encodeState(value) {
      const bytes = new TextEncoder().encode(JSON.stringify(value));
      let binary = "";
      bytes.forEach(byte => binary += String.fromCharCode(byte));
      return btoa(binary).replaceAll("+", "-").replaceAll("/", "_").replace(/=+$/, "");
    }

    function decodeState(value) {
      const base64 = value.replaceAll("-", "+").replaceAll("_", "/");
      const binary = atob(base64.padEnd(Math.ceil(base64.length / 4) * 4, "="));
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function saveToUrl() {
      const masks = notes.map(row =>
        row.reduce((mask, active, index) => active ? mask | (1 << index) : mask, 0).toString(36)
      ).join(".");
      const state = {
        v: 1,
        m: mode,
        d: division,
        q: compactCopy,
        n: masks,
        e: getEmojiValues()
      };
      history.replaceState(null, "", `#s=${encodeState(state)}`);
    }

    function loadFromUrl() {
      if (!location.hash.startsWith("#s=")) return;
      try {
        const state = decodeState(location.hash.slice(3));
        if (state.v !== 1 || !["sp", "dp"].includes(state.m) || !divisionPatterns[state.d]) return;
        const loadedNotes = String(state.n).split(".").map(value => {
          const mask = parseInt(value, 36);
          return Array.from({ length: 8 }, (_, index) => Boolean(mask & (1 << index)));
        });
        if (loadedNotes.length >= 4 && loadedNotes.length <= 256) notes = loadedNotes;
        mode = state.m;
        division = state.d;
        compactCopy = Boolean(state.q);
        document.querySelector("#modeSp").setAttribute("aria-pressed", String(mode === "sp"));
        document.querySelector("#modeDp").setAttribute("aria-pressed", String(mode === "dp"));
        const compactButton = document.querySelector("#compactCopy");
        compactButton.setAttribute("aria-pressed", String(compactCopy));
        compactButton.textContent = `節約モード ${compactCopy ? "ON" : "OFF"}`;
        if (Array.isArray(state.e) && state.e.length === 13) {
          ["A", "B", "C"].forEach((set, setIndex) => {
            Array.from({ length: 4 }, (_, index) => {
              document.querySelector(`#emoji${set}${index}`).value = String(state.e[setIndex * 4 + index]);
            });
          });
          document.querySelector("#emojiBlank").value = String(state.e[12]);
        }
      } catch {
        showToast("URLの保存データを読み込めませんでした");
      }
    }

    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(message);
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.append(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        showToast(message);
      }
    }

    loadFromUrl();
    setDivision(division);
  </script>
</body>
</html>
