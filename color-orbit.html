<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="画像に含まれる色を円形の色分布として可視化するツール" />
  <title>色相環 — Image Color Orbit</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23132138'/%3E%3Cpath d='M16 3a13 13 0 0 1 11.3 6.5L16 16Z' fill='%23fa5c7c'/%3E%3Cpath d='M27.3 9.5A13 13 0 0 1 22.5 27L16 16Z' fill='%2355cbe8'/%3E%3Cpath d='M22.5 27A13 13 0 0 1 4.7 9.5L16 16Z' fill='%23f3cc4f'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; --ink:#f5f4fb; --muted:#aeadc1; --panel:#171526; --line:#39354f; --accent:#c899ff; --accent2:#58d6d0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 20% -10%,#30224c 0,transparent 35rem),#0b0a13; color:var(--ink); font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif; }
    main { width:min(1120px, calc(100% - 32px)); margin:auto; padding:32px 0 48px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:28px; }
    h1 { font-size:clamp(1.65rem, 4vw, 2.5rem); margin:0; letter-spacing:.04em; }
    header p { color:var(--muted); margin:.5rem 0 0; line-height:1.7; }
    .badge { color:var(--accent2); border:1px solid #357f7c; border-radius:999px; padding:.4rem .7rem; font-size:.82rem; white-space:nowrap; }
    .grid { display:grid; grid-template-columns:minmax(260px, .72fr) minmax(0,1.28fr); gap:20px; align-items:start; }
    .panel { background:color-mix(in srgb, var(--panel) 88%, transparent); border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:0 16px 45px #0003; }
    h2 { font-size:1rem; margin:0 0 14px; }
    .drop { border:1.5px dashed #756d93; border-radius:14px; min-height:170px; display:grid; place-items:center; text-align:center; padding:20px; cursor:pointer; transition:.2s; background:#0e0d18; }
    .drop:hover,.drop.dragging { border-color:var(--accent); background:#211a32; transform:translateY(-1px); }
    .drop strong { display:block; font-size:1.05rem; margin-bottom:.5rem; }
    .drop span { color:var(--muted); font-size:.88rem; line-height:1.6; }
    input[type=file] { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    .source-wrap { margin-top:18px; display:none; }
    .source-wrap.visible { display:block; }
    #source { width:100%; max-height:180px; object-fit:contain; background:#0e0d18; border-radius:12px; display:block; }
    .meta { color:var(--muted); font-size:.82rem; margin:.7rem 0 0; }
    .controls { margin-top:22px; display:grid; gap:14px; }
    label { display:grid; grid-template-columns:1fr auto; gap:6px; font-size:.9rem; }
    output { color:var(--accent2); font-variant-numeric:tabular-nums; }
    input[type=range] { grid-column:1 / -1; width:100%; accent-color:var(--accent); }
    .background { display:flex; gap:8px; }
    .background button { flex:1; height:34px; border:1px solid var(--line); border-radius:9px; background:var(--button-bg); cursor:pointer; color:transparent; }
    .background button[aria-pressed=true] { outline:2px solid var(--accent); outline-offset:2px; }
    .action { width:100%; border:0; border-radius:11px; background:var(--accent); color:#160d22; font-weight:800; padding:.85rem; margin-top:22px; cursor:pointer; font-size:.95rem; }
    .action:disabled { opacity:.4; cursor:not-allowed; }
    .output-panel { min-height:500px; display:flex; flex-direction:column; }
    .canvas-frame { position:relative; width:100%; aspect-ratio:1; display:grid; place-items:center; border-radius:15px; overflow:hidden; background:#08080e; }
    #result { width:100%; height:100%; display:block; image-rendering:auto; }
    .empty { position:absolute; text-align:center; color:var(--muted); padding:20px; pointer-events:none; }
    .empty b { color:var(--ink); display:block; margin-bottom:.5rem; }
    .legend { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:.78rem; padding:13px 4px 0; }
    .legend i { width:9px; height:9px; border-radius:50%; display:inline-block; background:linear-gradient(135deg,#f75773,#fac64c,#67d991,#4fa6fa,#a66bf4); margin-right:5px; }
    @media (max-width:760px) { main { width:min(100% - 24px, 600px); padding-top:22px; } header { align-items:flex-start; flex-direction:column; gap:10px; } .grid { grid-template-columns:1fr; } .output-panel { min-height:0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>色相環</h1><p>画像の形ではなく、含まれる色の分布を円のなかに描きます。</p></div>
      <span class="badge">端末内で処理</span>
    </header>
    <div class="grid">
      <section class="panel" aria-labelledby="input-heading">
        <h2 id="input-heading">画像を入れる</h2>
        <label class="drop" id="drop-zone" for="file-input"><span><strong>画像をドロップ</strong>クリックして選択、または画像をコピーして貼り付け</span></label>
        <input id="file-input" type="file" accept="image/*" />
        <div class="source-wrap" id="source-wrap"><img id="source" alt="選択された元画像のプレビュー" /><p class="meta" id="image-meta"></p></div>
        <div class="controls" aria-label="描画の調整">
          <label>色相の回転 <output id="rotation-value">0°</output><input id="rotation" type="range" min="-180" max="180" value="0" /></label>
          <label>散らばり <output id="scatter-value">12%</output><input id="scatter" type="range" min="0" max="35" value="12" /></label>
          <label>点の大きさ <output id="size-value">1.4</output><input id="dot-size" type="range" min="0.5" max="4" step="0.1" value="1.4" /></label>
          <div><span style="font-size:.9rem">背景</span><div class="background" role="group" aria-label="背景色" style="margin-top:7px"><button data-bg="#08080e" aria-label="黒い背景" aria-pressed="true" style="--button-bg:#08080e"></button><button data-bg="#f7f5ff" aria-label="白い背景" aria-pressed="false" style="--button-bg:#f7f5ff"></button><button data-bg="#20162e" aria-label="紫の背景" aria-pressed="false" style="--button-bg:#20162e"></button></div></div>
        </div>
        <button class="action" id="download" disabled>PNGを保存</button>
      </section>
      <section class="panel output-panel" aria-labelledby="result-heading">
        <h2 id="result-heading">色の分布</h2>
        <div class="canvas-frame"><canvas id="result" width="900" height="900" aria-label="色の分布図"></canvas><div class="empty" id="empty"><b>まだ画像がありません</b>画像を入れると、色がここに集まります。</div></div>
        <div class="legend"><span><i></i>円周：色相</span><span>中心からの距離：彩度</span></div>
      </section>
    </div>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    const canvas = $('#result'), ctx = canvas.getContext('2d');
    const work = document.createElement('canvas'), workCtx = work.getContext('2d', {willReadFrequently:true});
    let imageData = null, background = '#08080e';
    const controls = ['rotation','scatter','dot-size'];
    function syncLabels() { $('#rotation-value').textContent = `${$('#rotation').value}°`; $('#scatter-value').textContent = `${$('#scatter').value}%`; $('#size-value').textContent = $('#dot-size').value; }
    function hsl(rgb) { let [r,g,b] = rgb.map(v => v / 255), max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min, h=0; const l=(max+min)/2, s=d === 0 ? 0 : d/(1-Math.abs(2*l-1)); if(d) { if(max===r) h=((g-b)/d)%6; else if(max===g) h=(b-r)/d+2; else h=(r-g)/d+4; h=(h*60+360)%360; } return [h,s,l]; }
    function random(n) { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
    function draw() {
      if (!imageData) return; syncLabels();
      const {data,width,height} = imageData, cw = canvas.width, center=cw/2, radius=cw*.465;
      const rotation = Number($('#rotation').value) * Math.PI / 180, scatter=Number($('#scatter').value)/100, dot=Number($('#dot-size').value);
      ctx.fillStyle=background; ctx.fillRect(0,0,cw,cw);
      const step = Math.max(1, Math.floor((width*height)/105000));
      for(let p=0; p<width*height; p+=step) {
        const i=p*4, a=data[i+3]; if(a<20) continue;
        const [h,s]=hsl([data[i],data[i+1],data[i+2]]), noise1=random(p+4)-.5, noise2=random(p+97)-.5;
        const angle=(h/360)*Math.PI*2 - Math.PI/2 + rotation + noise1*scatter*1.75;
        const r=Math.max(0, Math.min(radius, radius*(.05 + s*.91) + noise2*radius*scatter*.36));
        const x=center+Math.cos(angle)*r, y=center+Math.sin(angle)*r;
        ctx.fillStyle=`rgba(${data[i]},${data[i+1]},${data[i+2]},${Math.min(.9,.26+dot*.17)*(a/255)})`; ctx.fillRect(x-dot/2,y-dot/2,dot,dot);
      }
      $('#empty').hidden=true; $('#download').disabled=false;
    }
    function load(file) {
      if(!file || !file.type.startsWith('image/')) return;
      const img=new Image(); img.onload=()=>{
        const max=1000, scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        work.width=Math.max(1,Math.round(img.naturalWidth*scale)); work.height=Math.max(1,Math.round(img.naturalHeight*scale));
        workCtx.clearRect(0,0,work.width,work.height); workCtx.drawImage(img,0,0,work.width,work.height); imageData=workCtx.getImageData(0,0,work.width,work.height);
        $('#source').src=img.src; $('#source-wrap').classList.add('visible'); $('#image-meta').textContent=`${img.naturalWidth} × ${img.naturalHeight}px ／ ${Math.min(Math.round(file.size/1024),99999).toLocaleString()} KB`; draw();
      }; img.src=URL.createObjectURL(file);
    }
    $('#file-input').addEventListener('change',e=>load(e.target.files[0]));
    const zone=$('#drop-zone'); ['dragenter','dragover'].forEach(type=>zone.addEventListener(type,e=>{e.preventDefault();zone.classList.add('dragging')})); ['dragleave','drop'].forEach(type=>zone.addEventListener(type,e=>{e.preventDefault();zone.classList.remove('dragging')})); zone.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
    window.addEventListener('paste',e=>{const item=[...e.clipboardData.items].find(i=>i.type.startsWith('image/')); if(item) load(item.getAsFile());});
    controls.forEach(id=>$('#'+id).addEventListener('input',draw));
    document.querySelectorAll('[data-bg]').forEach(button=>button.addEventListener('click',()=>{background=button.dataset.bg;document.querySelectorAll('[data-bg]').forEach(b=>b.setAttribute('aria-pressed',b===button));draw()}));
    $('#download').addEventListener('click',()=>{ const a=document.createElement('a'); a.download='color-orbit.png'; a.href=canvas.toDataURL('image/png'); a.click(); });
    syncLabels();
  </script>
</body>
</html>
