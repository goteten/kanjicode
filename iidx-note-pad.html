<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>8KEY NOTE PAD</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090e;
      --panel: #10141d;
      --panel-2: #171d28;
      --line: #293141;
      --line-strong: #586277;
      --ink: #f4f7fb;
      --muted: #8c97aa;
      --accent: #ff3c62;
      --cyan: #3c8dff;
      --cell: clamp(36px, 10.1vw, 57px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(18px, 4vw, 42px) 8px 64px;
      color: var(--ink);
      background:
        radial-gradient(circle at 24% -8%, rgba(255, 38, 83, .14), transparent 32rem),
        radial-gradient(circle at 78% 4%, rgba(41, 124, 255, .12), transparent 29rem),
        var(--bg);
      font-family: Inter, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    main {
      width: min(650px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      padding-inline: 5px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 8vw, 47px);
      line-height: .95;
      letter-spacing: -.045em;
    }

    .count {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 5px 12px;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 13px;
      color: var(--ink);
      background: var(--panel-2);
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { border-color: #515d73; }
    button:focus-visible { outline: 3px solid #ff7390; outline-offset: 2px; }
    button.primary { color: white; border-color: var(--accent); background: var(--accent); }
    button.danger { margin-left: auto; color: #ff9aaa; }

    .settings {
      margin: 0 5px 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .settings-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
    }

    .replacement-fields {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .replacement-field {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      text-align: center;
    }

    .replacement-field input {
      width: 100%;
      min-width: 0;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 8px;
      color: var(--ink);
      background: var(--panel-2);
      font: inherit;
      font-size: 12px;
      text-align: center;
    }

    .replacement-field input:focus {
      outline: 3px solid #ff7390;
      outline-offset: 1px;
    }

    .chart {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }

    .labels, .row {
      display: grid;
      grid-template-columns: 32px repeat(8, var(--cell));
      justify-content: center;
      min-width: max-content;
      margin-inline: auto;
    }

    .labels {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 20, 29, .96);
      backdrop-filter: blur(8px);
    }

    .label {
      display: grid;
      place-items: center;
      height: 42px;
      font-size: clamp(17px, 4vw, 23px);
      user-select: none;
    }

    .label:nth-child(3),
    .label:nth-child(5),
    .label:nth-child(7),
    .label:nth-child(9) { padding-top: 8px; }

    .row {
      border-bottom: 1px solid var(--line);
    }

    .row:last-child { border-bottom: 0; }
    .row.measure-start { border-top: 2px solid var(--line-strong); }

    .row-number {
      display: grid;
      place-items: center;
      color: #687388;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .note {
      position: relative;
      width: var(--cell);
      height: var(--cell);
      padding: 0;
      border: 0;
      border-left: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
    }

    .note::after {
      content: "";
      position: absolute;
      inset: 7px 4px;
      border: 1px solid transparent;
      border-radius: 5px;
      opacity: 0;
      transform: scale(.76);
      transition: opacity .1s ease, transform .12s ease;
    }

    .note[data-lane="scratch"]::after { inset-inline: 5px; }
    .note[data-key="white"]::after { background: #edf1f7; border-color: white; }
    .note[data-key="blue"]::after { background: #2378e7; border-color: #5da4ff; }
    .note[data-key="red"]::after { background: #ed3154; border-color: #ff7891; }

    .note[aria-pressed="true"]::after {
      opacity: 1;
      transform: scale(1);
      box-shadow: 0 3px 13px rgba(0, 0, 0, .32);
    }

    .note:hover { background-color: rgba(255,255,255,.028); }
    .note:focus-visible { outline-offset: -4px; }

    .hint {
      margin: 13px 7px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 5;
      translate: -50% 12px;
      padding: 10px 16px;
      border-radius: 999px;
      color: white;
      background: var(--accent);
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
    }

    .toast.show { opacity: 1; translate: -50% 0; }

    @media (max-width: 520px) {
      button.danger { margin-left: 0; }
      .toolbar button { flex: 1; padding-inline: 8px; }
      .labels, .row { grid-template-columns: 27px repeat(8, var(--cell)); }
      .replacement-fields { grid-template-columns: repeat(2, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">8-LANE CHART SKETCH</p>
        <h1>8KEY NOTE PAD</h1>
      </div>
      <p class="count"><span id="rowCount">16</span> rows</p>
    </header>

    <div class="toolbar" aria-label="譜面の操作">
      <button type="button" id="addRows">＋ 4行</button>
      <button type="button" id="removeRows">− 4行</button>
      <button type="button" class="primary" id="copyChart">譜面をコピー</button>
      <button type="button" id="copyDiscord">Discord用コピー</button>
      <button type="button" id="copyShareUrl">共有URLをコピー</button>
      <button type="button" class="danger" id="clearChart">全消去</button>
    </div>

    <section class="settings" aria-label="Discord用の置換文字列">
      <span class="settings-label">DISCORD用の置換文字列</span>
      <div class="replacement-fields">
        <label class="replacement-field">🟥 赤
          <input id="replacementRed" value=":red_square:" aria-label="赤のDiscord用置換文字列">
        </label>
        <label class="replacement-field">⬜️ 白
          <input id="replacementWhite" value=":white_large_square:" aria-label="白のDiscord用置換文字列">
        </label>
        <label class="replacement-field">🟦 青
          <input id="replacementBlue" value=":blue_square:" aria-label="青のDiscord用置換文字列">
        </label>
        <label class="replacement-field">空白
          <input id="replacementBlank" value=":black_large_square:" aria-label="空白のDiscord用置換文字列">
        </label>
      </div>
    </section>

    <section class="chart" aria-label="8列の譜面">
      <div class="labels" aria-hidden="true">
        <span></span>
        <span class="label">🟥</span>
        <span class="label">⬜️</span>
        <span class="label">🟦</span>
        <span class="label">⬜️</span>
        <span class="label">🟦</span>
        <span class="label">⬜️</span>
        <span class="label">🟦</span>
        <span class="label">⬜️</span>
      </div>
      <div id="grid"></div>
    </section>

    <p class="hint">
      マスを押してノートを配置します。設定はこの端末に自動保存されます。
    </p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const laneSymbols = ["🟥", "⬜️", "🟦", "⬜️", "🟦", "⬜️", "🟦", "⬜️"];
    const keyTypes = ["red", "white", "blue", "white", "blue", "white", "blue", "white"];
    const storageKey = "eight-key-note-pad-v1";
    const grid = document.querySelector("#grid");
    const rowCount = document.querySelector("#rowCount");
    const toast = document.querySelector("#toast");
    const replacementInputs = {
      red: document.querySelector("#replacementRed"),
      white: document.querySelector("#replacementWhite"),
      blue: document.querySelector("#replacementBlue"),
      blank: document.querySelector("#replacementBlank")
    };
    let notes = Array.from({ length: 16 }, () => Array(8).fill(false));
    let toastTimer;

    function render() {
      grid.replaceChildren();
      notes.forEach((rowNotes, rowIndex) => {
        const row = document.createElement("div");
        row.className = "row";
        if (rowIndex > 0 && rowIndex % 4 === 0) row.classList.add("measure-start");

        const number = document.createElement("span");
        number.className = "row-number";
        number.textContent = rowIndex + 1;
        row.append(number);

        rowNotes.forEach((active, laneIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "note";
          button.dataset.key = keyTypes[laneIndex];
          if (laneIndex === 0) button.dataset.lane = "scratch";
          button.setAttribute("aria-pressed", String(active));
          button.setAttribute("aria-label", `${rowIndex + 1}行目 ${laneIndex === 0 ? "スクラッチ" : laneIndex + "鍵"}`);
          button.addEventListener("click", () => toggleNote(rowIndex, laneIndex, button));
          row.append(button);
        });
        grid.append(row);
      });
      rowCount.textContent = notes.length;
      saveLocal();
    }

    function toggleNote(rowIndex, laneIndex, button) {
      notes[rowIndex][laneIndex] = !notes[rowIndex][laneIndex];
      button.setAttribute("aria-pressed", String(notes[rowIndex][laneIndex]));
      saveLocal();
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1700);
    }

    function saveLocal() {
      try {
        localStorage.setItem(storageKey, JSON.stringify({
          notes,
          replacements: getReplacements()
        }));
      } catch {}
    }

    function loadLocal() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (Array.isArray(saved?.notes) && saved.notes.every(row => Array.isArray(row) && row.length === 8)) {
          notes = saved.notes.map(row => row.map(Boolean));
        }
        if (saved?.replacements) setReplacements(saved.replacements);
      } catch {}
    }

    function getReplacements() {
      return Object.fromEntries(
        Object.entries(replacementInputs).map(([key, input]) => [key, input.value])
      );
    }

    function setReplacements(replacements) {
      Object.entries(replacementInputs).forEach(([key, input]) => {
        if (typeof replacements[key] === "string") input.value = replacements[key];
      });
    }

    function encodeChart() {
      const bytes = [];
      for (let index = 0; index < notes.length; index += 8) {
        notes.slice(index, index + 8).forEach(row => {
          bytes.push(row.reduce((value, active, lane) => value | (active ? 1 << lane : 0), 0));
        });
      }
      return btoa(String.fromCharCode(...bytes)).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
    }

    function loadFromUrl() {
      const params = new URLSearchParams(location.hash.slice(1));
      const chart = params.get("c");
      const rows = Number(params.get("r"));
      if (!chart || !Number.isInteger(rows) || rows < 4 || rows > 256) return false;
      try {
        const normalized = chart.replaceAll("-", "+").replaceAll("_", "/");
        const bytes = Array.from(atob(normalized), character => character.charCodeAt(0));
        if (bytes.length < rows) return false;
        notes = bytes.slice(0, rows).map(value =>
          Array.from({ length: 8 }, (_, lane) => Boolean(value & (1 << lane)))
        );
        setReplacements({
          red: params.get("red"),
          white: params.get("white"),
          blue: params.get("blue"),
          blank: params.get("blank")
        });
        return true;
      } catch {
        return false;
      }
    }

    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.append(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      showToast(message);
    }

    document.querySelector("#addRows").addEventListener("click", () => {
      notes.push(...Array.from({ length: 4 }, () => Array(8).fill(false)));
      render();
    });

    document.querySelector("#removeRows").addEventListener("click", () => {
      if (notes.length <= 4) return showToast("これ以上は減らせません");
      notes.splice(-4);
      render();
    });

    document.querySelector("#clearChart").addEventListener("click", () => {
      notes = notes.map(() => Array(8).fill(false));
      render();
      showToast("譜面を消去しました");
    });

    document.querySelector("#copyChart").addEventListener("click", () => {
      const lastActive = notes.reduce((last, row, index) => row.some(Boolean) ? index : last, -1);
      const end = Math.max(lastActive + 1, 4);
      const text = notes.slice(0, end)
        .map(row => row.map((active, lane) => active ? laneSymbols[lane] : "　").join(""))
        .join("\n");
      copyText(text, "譜面をコピーしました");
    });

    document.querySelector("#copyDiscord").addEventListener("click", () => {
      const lastActive = notes.reduce((last, row, index) => row.some(Boolean) ? index : last, -1);
      const end = Math.max(lastActive + 1, 4);
      const replacements = getReplacements();
      const text = notes.slice(0, end)
        .map(row => row.map((active, lane) =>
          active ? replacements[keyTypes[lane]] : replacements.blank
        ).join(""))
        .join("\n");
      copyText(text, "Discord用の譜面をコピーしました");
    });

    document.querySelector("#copyShareUrl").addEventListener("click", () => {
      const url = new URL(location.href);
      url.hash = new URLSearchParams({
        c: encodeChart(),
        r: String(notes.length),
        ...getReplacements()
      });
      copyText(url.href, "共有URLをコピーしました");
    });

    Object.values(replacementInputs).forEach(input => input.addEventListener("input", saveLocal));

    if (!loadFromUrl()) loadLocal();
    render();
  </script>
</body>
</html>
