<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="石を滑らせ、黒い格子点に石を乗せて4つ並べる、AI・2人対戦のカーリング四目並べ。">
<title>カーリング四目並べ</title>
<style>
:root{color-scheme:light;font-family:"Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;font-weight:500;line-height:1.6;color:#243741;background:#f5f7f8}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:#f5f7f8}main{max-width:664px;margin:auto;padding:12px}header{margin:16px 0 24px}h1{font-weight:700;font-size:clamp(24px,4vw,36px);margin:0 0 8px}header p{color:#a6c5d5;line-height:1.7}.eyebrow{color:#7ed4e2;font-size:12px;letter-spacing:.18em;margin-bottom:12px}.setup{max-width:480px;margin:36px auto;border:1px solid #d3dce1;border-radius:10px;background:#ffffff;padding:20px}.setup h2{font-size:24px;margin:0}.setup p{color:#61727d;line-height:1.8}.setup button{width:100%;background:#187b89;color:#ffffff;font-weight:700;margin-top:12px}.layout{display:grid;gap:12px}.rink{border:1px solid #cad5db;border-radius:10px;overflow:hidden;background:#dff0f5;box-shadow:none}canvas{display:block;width:100%;height:auto;touch-action:none;outline-offset:-5px}.launch-position{padding:12px 12.5% 16px;background:#ffffff;border-top:1px solid #cad5db}.launch-position #power-mode{display:block;margin:10px auto 0;padding:7px 14px;font-size:13px}.launch-position #power-mode[aria-pressed="true"]{background:#e8a15d;color:#241409;border-color:#ffd099}.launch-position label{margin:0}.launch-position input{margin:0;min-height:28px}label{display:grid;grid-template-columns:1fr auto;gap:8px;margin:16px 0;font-size:14px}output{color:#187b89;font-variant-numeric:tabular-nums}input{grid-column:1/-1;width:100%;accent-color:#187b89}button,select{font:inherit;border:1px solid #cad5db;border-radius:10px;padding:11px 14px;background:#ffffff;color:#243741}button{cursor:pointer}select{width:100%;grid-column:1/-1}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #187b89;outline-offset:3px}.end-actions{display:flex;gap:12px}.end-actions button{flex:1}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
</style>
</head>
<body>
<main>
<header id="intro"><h1>カーリング四目並べ</h1></header>
<section class="panel setup" id="setup" aria-labelledby="setup-title"><h2 id="setup-title">対戦をはじめる</h2><p id="setup-note">相手とレベルを選んでください。</p><label>対戦相手<select id="opponent"><option value="ai">AIと対戦（あなたは赤）</option><option value="human">2人で対戦</option></select></label><label>AIレベル<select id="ai-level"><option value="1" selected>1 · やさしい</option><option value="2">2 · 気軽</option><option value="3">3 · ふつう</option><option value="4">4 · 強い</option><option value="5">5 · 最強</option></select></label><button id="start-game">この設定ではじめる</button></section>
<div class="layout" id="game" hidden>
<div class="rink"><canvas id="rink" width="640" height="760" tabindex="0" aria-label="カーリングの盤面。下の石を後ろに引いて離すと投石できます。投げる位置は下のスライダーで調整できます。矢印キーで角度と強さを調整し、Enterでも投げられます。"></canvas><div class="launch-position"><label>投げる位置 <output id="position-value"></output><input id="position" type="range" min="80" max="560" value="320" step="1"></label><button id="power-mode" type="button" aria-pressed="false">パワーモード</button></div></div>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>
<div hidden><input id="angle" type="range" min="-65" max="65" value="0"><input id="power" type="range" min="140" max="1400" value="300"><button id="shoot">石を投げる</button></div>
<div class="end-actions" id="end-actions" hidden><button id="undo">戻す</button><button id="restart">もう一度遊ぶ</button></div>

</div>
</main>
<script>
'use strict';
const canvas=document.getElementById('rink'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const N=9,START=80,GAP=60,R=30,LEFT=50,RIGHT=590,TOP=50,BOTTOM=740;
const colors=['#e45650','#367fce'];
let stones=[],turn=0,shots=0,moving=false,result=null,history=[],drag=null,lastTime=null,accumulator=0,motionTime=0;
let gameStarted=false,matchConfig=null,powerMode=false,fadingStones=[];
function humanPowerLimit(){return powerMode?1400:470;}
function opponentMode(){return matchConfig?matchConfig.opponent:$('opponent').value;}
let aiThinking=false,aiWorker=null,aiGeneration=0,aiSummary="青のAIは選んだレベルに応じて投石を考えます。",gameMotion=null;
function aiBudget(){return [3,8,15,30,2000][Math.max(0,Math.min(4,Number(matchConfig?matchConfig.level:$('ai-level').value)-1))]||2000;}
function isAITurn(){return opponentMode()==='ai'&&turn===1;}
const inputs=['position','angle','power'].map($);
function settings(){return {x:Number($('position').value),angle:Number($('angle').value)*Math.PI/180,power:Math.min(humanPowerLimit(),Number($('power').value))};}
function updateUI(){
 $('setup').hidden=gameStarted; $('game').hidden=!gameStarted; $('intro').hidden=gameStarted;
 $('end-actions').hidden=!gameStarted||!result;
 $('power-mode').disabled=!gameStarted||moving||!!result||isAITurn()||!!drag;
 $('power-mode').setAttribute('aria-pressed',String(powerMode));
 $('power-mode').textContent=powerMode?'パワーモード ON':'パワーモード';
 const names=['赤','青'];
 $('status').textContent=result ? (result.draw?'引き分け！':names[result.player]+'の勝ち！') : names[turn]+'の番'+(aiThinking?' · AIが考えています':moving?' · 石が滑っています':'');
 $('status').style.color=result&&!result.draw?colors[result.player]:moving?'#eaf5fc':colors[turn];
 $('shoot').disabled=!gameStarted||moving||!!result||isAITurn(); $('undo').disabled=moving||history.length===0;
 $('undo').textContent=opponentMode()==='ai'?'自分の番まで戻す':'1投戻す';
 $('opponent').disabled=gameStarted; $('ai-level').disabled=gameStarted||opponentMode()!=='ai';
 inputs.forEach(input=>input.disabled=!gameStarted||moving||!!result||isAITurn());
 $('position-value').textContent=((Number($('position').value)-320)/60).toFixed(1)+' マス';
}
function cellOf(s){
 if(s.x<LEFT||s.x>RIGHT||s.y<TOP||s.y>BOTTOM)return null;
 return {c:Math.min(N-1,Math.max(0,Math.round((s.x-START)/GAP))),r:Math.min(N-1,Math.max(0,Math.round((s.y-START)/GAP)))};
}
function occupiedPoints(list=stones){
 const owners=Array.from({length:N},()=>Array(N).fill(null));
 const distances=Array.from({length:N},()=>Array(N).fill(Infinity));
 for(const s of list){
  const cell=cellOf(s);if(!cell)continue;
  const distance=(s.x-START-cell.c*GAP)**2+(s.y-START-cell.r*GAP)**2;
  if(distance>=R*R)continue; // Edge-only contact does not occupy a point.
  // Prefer the deeper covering stone for tiny numerical collision overlaps.
  if(distance<distances[cell.r][cell.c]){owners[cell.r][cell.c]=s;distances[cell.r][cell.c]=distance;}
 }
 return owners;
}
function boardState(list=stones){
 return occupiedPoints(list).map(row=>row.map(s=>s?1<<s.player:0));
}
function winningLines(board,player){
 const found=[],bit=1<<player;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dc,dr] of [[1,0],[0,1],[1,1],[1,-1]]){
  const line=[];
  for(let i=0;i<4;i++){const rr=r+dr*i,cc=c+dc*i;if(rr<0||rr>=N||cc<0||cc>=N||board[rr][cc]!==bit)break;line.push({r:rr,c:cc});}
  if(line.length===4)found.push(line);
 }
 return found;
}

// These pure functions run both in the visible game and in the AI worker.
function settleStones(list){
 return list.filter(s=>cellOf(s)).map(s=>({...s,vx:0,vy:0}));
}
function outcomeFor(list,shotCount){
 const board=boardState(list),wins=[winningLines(board,0),winningLines(board,1)];
 if(wins[0].length&&wins[1].length)return {draw:true,lines:wins.flat()};
 if(wins[0].length||wins[1].length){const player=wins[0].length?0:1;return {player,lines:wins[player]};}
 if(shotCount>=80)return {draw:true,lines:[]};
 return null;
}
function createShotState(initial,shot,player){
 const list=initial.filter(s=>Math.abs(s.y-690)>=R*2).map(s=>({...s,vx:0,vy:0}));
 list.push({x:shot.x,y:690,vx:Math.sin(shot.angle)*shot.power,vy:-Math.cos(shot.angle)*shot.power,player,entered:true});
 return {stones:list,time:0,done:false};
}
function stepPhysics(state,dt){
 if(state.done)return;
 state.time+=dt;
 const list=state.stones;
 for(const s of list){
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  if(s.x<LEFT+R){s.x=LEFT+R;s.vx=Math.abs(s.vx)*.82;}
  if(s.x>RIGHT-R){s.x=RIGHT-R;s.vx=-Math.abs(s.vx)*.82;}
  if(s.y<TOP+R){s.y=TOP+R;s.vy=Math.abs(s.vy)*.82;}
  // The launch area is inside the rink; every stone rebounds from the floor.
  if(s.y>BOTTOM-R){s.y=BOTTOM-R;s.vy=-Math.abs(s.vy)*.82;}
  const speed=Math.hypot(s.vx,s.vy),next=Math.max(0,speed-140*dt);
  if(speed){s.vx*=next/speed;s.vy*=next/speed;}
 }
 for(let pass=0;pass<4;pass++){
 for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
  const a=list[i],b=list[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d>=R*2)continue;
  if(d<.00001){dx=1;dy=0;d=1;}
  const nx=dx/d,ny=dy/d,overlap=R*2-d;
  a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;
  const approach=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(approach<0){const impulse=-(1+.9)*approach/2;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;}
 }
 }
 // Collision corrections must not push a settled stone beyond a wall.
 for(const s of list){
  s.x=Math.max(LEFT+R,Math.min(RIGHT-R,s.x));
  s.y=Math.max(TOP+R,Math.min(BOTTOM-R,s.y));
 }
 state.stones=list;
 state.done=state.stones.every(s=>Math.hypot(s.vx,s.vy)<1)||state.time>20;
}
function simulateShot(initial,shot,player,deadline=Infinity){
 const state=createShotState(initial,shot,player);
 for(let step=0;!state.done;step++){
  // An interrupted candidate is discarded, never scored as a finished shot.
  if(step%16===0&&performance.now()>=deadline)return null;
  stepPhysics(state,1/120);
 }
 return settleStones(state.stones);
}
function finishShot(){
 stones=settleStones(stones);moving=false;result=outcomeFor(stones,shots);
 if(!result)turn=1-turn;
 updateUI();startAI();
}
function launch(shot=settings(),fromAI=false){
 if(!gameStarted||moving||result||(!fromAI&&isAITurn()))return;
 history.push({stones:stones.map(s=>({...s})),turn,shots});
 fadingStones=stones.filter(s=>Math.abs(s.y-690)<R*2).map(s=>({...s,age:0}));
 gameMotion=createShotState(stones,shot,turn);stones=gameMotion.stones;
 shots++;moving=true;motionTime=0;accumulator=0;drag=null;updateUI();
}
function physics(dt){
 stepPhysics(gameMotion,dt);stones=gameMotion.stones;motionTime=gameMotion.time;
 if(gameMotion.done)finishShot();
}
// Evaluate every four-point window, including gaps, and distinct winning threats.
function evaluateBoard(board,player){
 let score=0;const own=1<<player,other=1<<(1-player),threats=[new Set(),new Set()];
 const weights=[0,10,110,1800,1000000];
 for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dc,dr] of [[1,0],[0,1],[1,1],[1,-1]]){
  const er=r+dr*3,ec=c+dc*3;if(er<0||er>=N||ec<0||ec>=N)continue;
  let a=0,b=0,empty=-1;
  for(let i=0;i<4;i++){const rr=r+dr*i,cc=c+dc*i,value=board[rr][cc];if(value===own)a++;else if(value===other)b++;else empty=rr*N+cc;}
  if(!b){score+=weights[a];if(a===3)threats[0].add(empty);}
  if(!a){score-=weights[b]*1.35;if(b===3)threats[1].add(empty);}
 }
 if(threats[0].size>=2)score+=2500*(threats[0].size-1);
 if(threats[1].size>=2)score-=4500*(threats[1].size-1);
 for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]){
  const central=8-Math.abs(r-4)-Math.abs(c-4);
  score+=(board[r][c]===own?1:-1)*(12+central*3);
 }
 return score;
}
function evaluatePosition(list,player,shotCount){
 const outcome=outcomeFor(list,shotCount);
 if(outcome)return outcome.draw?0:outcome.player===player?1e9:-1e9;
 const owners=occupiedPoints(list),board=owners.map(row=>row.map(s=>s?1<<s.player:0));
 let score=evaluateBoard(board,player);
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const s=owners[r][c];if(!s)continue;
  const d=(s.x-START-c*GAP)**2+(s.y-START-r*GAP)**2;
  score+=(s.player===player?1:-1)*8*(1-d/(R*R));
 }
 return score;
}
function normalizeShot(shot){
 return {x:Math.max(80,Math.min(560,Math.round(shot.x))),angle:Math.max(-65,Math.min(65,Math.round(shot.angle*180/Math.PI)))*Math.PI/180,power:Math.max(140,Math.min(1400,Math.round(shot.power)))};
}
// Execution error is applied after searching, so the AI cannot optimize it away.
function inaccurateAIShot(shot,level,random=Math.random){
 const errors=[{x:90,angle:20,power:.45},{x:65,angle:14,power:.32},{x:40,angle:9,power:.22},{x:12,angle:3,power:.06},{x:0,angle:0,power:0}];
 const error=errors[Math.max(0,Math.min(4,Number(level)-1))]||errors[4];
 if(!error.x)return normalizeShot(shot);
 return normalizeShot({x:shot.x+(random()*2-1)*error.x,angle:shot.angle+(random()*2-1)*error.angle*Math.PI/180,power:shot.power*(1+(random()*2-1)*error.power)});
}
function searchBestShot(initial,player,shotCount,budgetMs){
 const started=performance.now(),deadline=started+Math.min(2000,Math.max(1,budgetMs));
 const board=boardState(initial),targets=[],own=1<<player,other=1<<(1-player);
 // Rank targets in one pass over line windows, avoiding 81 full evaluations.
 const priorities=Array.from({length:N},()=>Array(N).fill(0)),weights=[0,10,110,1800,1000000];
 for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dc,dr] of [[1,0],[0,1],[1,1],[1,-1]]){
  const er=r+3*dr,ec=c+3*dc;if(er<0||er>=N||ec<0||ec>=N)continue;
  let a=0,b=0;for(let i=0;i<4;i++){const v=board[r+i*dr][c+i*dc];if(v===own)a++;else if(v===other)b++;}
  const baseline=(!b?weights[a]:0)-(!a?weights[b]*1.35:0);
  for(let i=0;i<4;i++){
   const rr=r+i*dr,cc=c+i*dc,v=board[rr][cc],nextA=a+(v===own?0:1),nextB=b-(v===other?1:0);
   priorities[rr][cc]+=(!nextB?weights[nextA]:0)-(!nextA?weights[nextB]*1.35:0)-baseline;
  }
 }
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const central=12+(8-Math.abs(r-4)-Math.abs(c-4))*3;
  targets.push({x:START+c*GAP,y:START+r*GAP,priority:priorities[r][c]+(board[r][c]===own?0:board[r][c]===other?2:1)*central});
 }
 targets.sort((a,b)=>b.priority-a.priority);
 const seeds=[];
 // Straight placements first, then side approaches that can get around blockers.
 for(const offset of [0,-45,45])for(const target of targets){
  const x=Math.max(80,Math.min(560,target.x+offset)),dx=target.x-x,dy=690-target.y;
  seeds.push(normalizeShot({x,angle:Math.atan2(dx,dy),power:Math.sqrt(280*Math.hypot(dx,dy))}));
 }
 for(const s of initial)seeds.push(normalizeShot({x:s.x,angle:0,power:1400}));
 let best=null,current=null,currentScore=-Infinity,bestScore=-Infinity,evaluated=0,seedIndex=0,iteration=0;
 while(performance.now()<deadline){
  const progress=(performance.now()-started)/(deadline-started);
  let shot;
  if(seedIndex<seeds.length&&(iteration%2===0||!current))shot=seeds[seedIndex++];
  else if(!current||iteration%17===0)shot=normalizeShot({x:80+Math.random()*480,angle:(Math.random()*130-65)*Math.PI/180,power:140+Math.random()*1260});
  else{
   const scale=.15+.85*(1-progress);
   shot=normalizeShot({x:current.x+(Math.random()-Math.random())*100*scale,angle:current.angle+(Math.random()-Math.random())*.5*scale,power:current.power+(Math.random()-Math.random())*350*scale});
  }
  const predicted=simulateShot(initial,shot,player,deadline);
  if(!predicted)break;
  const score=evaluatePosition(predicted,player,shotCount+1);evaluated++;
  if(score>bestScore){best=shot;bestScore=score;}
  const temperature=1000*(1-progress)**2+5;
  if(!current||score>=currentScore||Math.random()<Math.exp((score-currentScore)/temperature)){current=shot;currentScore=score;}
  if(iteration%31===30){current=best;currentScore=bestScore;}
  if(bestScore>=1e9)break;
  iteration++;
 }
 return {shot:best||normalizeShot({x:320,angle:0,power:300}),score:bestScore,evaluated,elapsed:performance.now()-started};
}
function workerSource(){
 const constants='const N='+N+',START='+START+',GAP='+GAP+',R='+R+',LEFT='+LEFT+',RIGHT='+RIGHT+',TOP='+TOP+',BOTTOM='+BOTTOM+';';
 const shared=[cellOf,occupiedPoints,boardState,winningLines,settleStones,outcomeFor,createShotState,stepPhysics,simulateShot,evaluateBoard,evaluatePosition,normalizeShot,searchBestShot].map(fn=>fn.toString()).join('\n');
 return constants+'\n'+shared+'\nself.onmessage=event=>{const d=event.data;self.postMessage(searchBestShot(d.stones,d.player,d.shots,d.budgetMs));};';
}
function cancelAI(){
 aiGeneration++;if(aiWorker){aiWorker.terminate();aiWorker=null;}aiThinking=false;
}
function startAI(){
 if(!gameStarted||!isAITurn()||moving||result||aiThinking)return;
 aiThinking=true;aiSummary='投石後の盤面を探索中…';updateUI();
 const generation=++aiGeneration;
 try{
  const url=URL.createObjectURL(new Blob([workerSource()],{type:'text/javascript'}));
  try{aiWorker=new Worker(url);}finally{URL.revokeObjectURL(url);}
  aiWorker.onmessage=event=>{
   if(generation!==aiGeneration||!aiThinking||!isAITurn()||moving||result)return;
   const answer=event.data;cancelAI();
   aiSummary='前の探索：'+(answer.elapsed/1000).toFixed(2)+'秒 · '+answer.evaluated+'候補';
   // The AI shot must not overwrite the human player's launch controls.
   const shot=inaccurateAIShot(answer.shot,matchConfig.level);
   launch(shot,true);
  };
  aiWorker.onerror=()=>{if(generation===aiGeneration)aiFailed();};
  aiWorker.postMessage({stones:stones.map(s=>({...s})),player:turn,shots,budgetMs:aiBudget()});
 }catch(error){aiFailed();}
}
function aiFailed(){
 resetToSetup();$('setup-note').textContent='AIを起動できませんでした。対戦相手を選び直してください。';
}
function circle(x,y,r,fill,stroke,width=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}}
let aimPreviewCache=null;
function emptyRinkPreview(shot){
 const key=[shot.x,shot.angle,shot.power].join(':');
 if(aimPreviewCache&&aimPreviewCache.key===key)return aimPreviewCache;
 const state=createShotState([],shot,0),points=[{x:shot.x,y:690}];
 let hitWall=false;
 while(!state.done){
  const before=state.stones[0],vx=before.vx,vy=before.vy;
  stepPhysics(state,1/120);
  const s=state.stones[0],last=points[points.length-1];
  hitWall=vx*s.vx<0||vy*s.vy<0;
  if(Math.hypot(s.x-last.x,s.y-last.y)>=2||state.done||hitWall)points.push({x:s.x,y:s.y});
  if(hitWall)break;
 }
 const s=state.stones[0];
 aimPreviewCache={key,points,hitWall,end:{x:s.x,y:s.y}};
 return aimPreviewCache;
}
function drawLaunchZone(){
 const top=690-R*2,bottom=Math.min(BOTTOM,690+R*2),height=bottom-top;
 ctx.save();ctx.beginPath();ctx.rect(LEFT,top,RIGHT-LEFT,height);ctx.clip();
 ctx.fillStyle='#d89b3920';ctx.fillRect(LEFT,top,RIGHT-LEFT,height);
 ctx.strokeStyle='#b8864380';ctx.lineWidth=1.5;
 for(let x=LEFT-height;x<=RIGHT;x+=10){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x+height,bottom);ctx.stroke();}
 ctx.restore();
}
function draw(){
 let prediction=null;
 ctx.clearRect(0,0,640,760);ctx.fillStyle='#e7f4f7';ctx.fillRect(0,0,640,760);
 ctx.fillStyle='#c8e4ed';ctx.fillRect(LEFT,TOP,RIGHT-LEFT,BOTTOM-TOP);
 ctx.strokeStyle='#adcdd7';ctx.lineWidth=1;
 // Dashed boundaries show grid spacing; occupation requires covering a dot.
 ctx.setLineDash([3,7]);
 for(let i=0;i<=N;i++){const q=50+i*GAP;ctx.beginPath();ctx.moveTo(q,50);ctx.lineTo(q,590);ctx.moveTo(50,q);ctx.lineTo(590,q);ctx.stroke();}
 ctx.setLineDash([]);ctx.strokeStyle='#78a9bc';
 for(let i=0;i<N;i++){const q=START+i*GAP;ctx.beginPath();ctx.moveTo(q,START);ctx.lineTo(q,560);ctx.moveTo(START,q);ctx.lineTo(560,q);ctx.stroke();}
 ctx.strokeStyle='#6095ab';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(LEFT,BOTTOM);ctx.lineTo(LEFT,TOP);ctx.lineTo(RIGHT,TOP);ctx.lineTo(RIGHT,BOTTOM);ctx.stroke();
 ctx.setLineDash([]);ctx.strokeStyle='#6095ab';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(LEFT,BOTTOM);ctx.lineTo(RIGHT,BOTTOM);ctx.stroke();ctx.setLineDash([]);
 drawLaunchZone();
 const owners=occupiedPoints(),board=owners.map(row=>row.map(s=>s?1<<s.player:0));
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const x=START+c*GAP,y=START+r*GAP,mask=board[r][c];
  circle(x,y,3,'#709bae');
  if(mask){circle(x,y,R+4,colors[mask===1?0:1]+'18',colors[mask===1?0:1],2);}
 }
 if(!moving){ctx.setLineDash([3,3]);ctx.lineWidth=1;for(const s of stones){const cell=cellOf(s);if(!cell||owners[cell.r][cell.c]!==s)continue;ctx.strokeStyle=colors[s.player]+'80';ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(START+cell.c*GAP,START+cell.r*GAP);ctx.stroke();}ctx.setLineDash([]);}
 ctx.fillStyle='#476e80';ctx.font='500 12px "Yu Gothic", "YuGothic", "Meiryo", sans-serif';ctx.textAlign='center';
 for(let i=0;i<N;i++){ctx.fillText(String(i+1),START+i*GAP,34);ctx.fillText('ABCDEFGHI'[i],30,START+i*GAP+4);}

 if(gameStarted&&!moving&&!result&&!isAITurn()){
  const shot=settings(),{x}=shot;prediction=emptyRinkPreview(shot);
  ctx.strokeStyle=colors[turn]+'99';ctx.lineWidth=2;ctx.setLineDash([3,7]);ctx.beginPath();
  ctx.moveTo(prediction.points[0].x,prediction.points[0].y);
  for(let i=1;i<prediction.points.length;i++)ctx.lineTo(prediction.points[i].x,prediction.points[i].y);
  ctx.stroke();ctx.setLineDash([]);
  drawStone({x,y:690,player:turn},true);

  if(drag){ctx.strokeStyle=colors[turn];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,690);ctx.lineTo(drag.x,drag.y);ctx.stroke();circle(drag.x,drag.y,7,colors[turn]+'60');}
 }
 for(const s of stones)drawStone(s,false);
 for(const s of fadingStones){ctx.save();ctx.globalAlpha=Math.max(0,1-s.age/.65);drawStone(s,false);ctx.restore();}
 if(prediction){
  const {x,y}=prediction.end;
  ctx.setLineDash([5,5]);circle(x,y,R,colors[turn]+'12',colors[turn]+'cc',2);ctx.setLineDash([]);
  ctx.strokeStyle=colors[turn];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);ctx.moveTo(x,y-6);ctx.lineTo(x,y+6);ctx.stroke();
 }
 if(result){
  ctx.strokeStyle=result.draw?'#82658c':'#f2b63e';ctx.lineWidth=7;ctx.lineCap='round';
  for(const line of result.lines){ctx.beginPath();ctx.moveTo(START+line[0].c*GAP,START+line[0].r*GAP);ctx.lineTo(START+line[3].c*GAP,START+line[3].r*GAP);ctx.stroke();}ctx.lineCap='butt';
  ctx.fillStyle='#ffffff';ctx.fillRect(50,650,540,62);ctx.fillStyle='#243741';ctx.font='700 24px "Yu Gothic", "YuGothic", "Meiryo", sans-serif';ctx.fillText(result.draw?'引き分け！':(result.player===0?'赤':'青')+'の勝ち！',320,689);
 }
}
function drawStone(s,preview){
 circle(s.x,s.y,R,s.player===0?'#ed7770':'#5b9cdf','#fff',2);
 circle(s.x,s.y,R-6,colors[s.player],'#ffffff70',1);
 ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.x-8,s.y);ctx.lineTo(s.x+8,s.y);ctx.stroke();ctx.lineCap='butt';
 if(s.player===1){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x,s.y-7);ctx.lineTo(s.x+7,s.y);ctx.lineTo(s.x,s.y+7);ctx.lineTo(s.x-7,s.y);ctx.closePath();ctx.stroke();}
 if(preview)circle(s.x,s.y,R+6,null,colors[s.player]+'60',2);
}
function point(event){const rect=canvas.getBoundingClientRect();return {x:(event.clientX-rect.left)*640/rect.width,y:(event.clientY-rect.top)*760/rect.height};}
canvas.addEventListener('pointerdown',event=>{
 if(!gameStarted||moving||result||isAITurn()||drag||(event.pointerType==='mouse'&&event.button!==0))return;
 const p=point(event),{x}=settings();if(Math.hypot(p.x-x,p.y-690)>40)return;
 drag={...p,id:event.pointerId,start:p,initial:settings()};canvas.setPointerCapture(event.pointerId);event.preventDefault();
});
canvas.addEventListener('pointermove',event=>{
 if(!drag||event.pointerId!==drag.id)return;
 const p=point(event);drag.x=p.x;drag.y=p.y;const {x}=settings();
 const dx=x-p.x,dy=p.y-690,length=Math.hypot(dx,dy);
 if(dy>0){$('angle').value=Math.max(-65,Math.min(65,Math.atan2(dx,dy)*180/Math.PI));$('power').value=Math.max(140,Math.min(humanPowerLimit(),length*(powerMode?14:5)));updateUI();}
});
function cancelDrag(){if(!drag)return;$('angle').value=drag.initial.angle*180/Math.PI;$('power').value=drag.initial.power;drag=null;updateUI();}
canvas.addEventListener('pointerup',event=>{
 if(!drag||event.pointerId!==drag.id)return;
 const p=point(event),{x}=settings(),valid=p.y>698&&Math.hypot(x-p.x,p.y-690)>12;
 if(valid){drag=null;launch();}else cancelDrag();
});
canvas.addEventListener('pointercancel',cancelDrag);canvas.addEventListener('lostpointercapture',cancelDrag);
inputs.forEach(input=>input.addEventListener('input',updateUI));$('shoot').addEventListener('click',()=>launch());
canvas.addEventListener('keydown',event=>{
 if(event.key==='Escape'){cancelDrag();return;}
 if(!gameStarted||moving||result||isAITurn())return;
 if(event.key===' '||event.key==='Enter'){event.preventDefault();launch();}
 else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){
  event.preventDefault();
  if(event.key==='ArrowLeft'||event.key==='ArrowRight')$('angle').value=Math.max(-65,Math.min(65,Number($('angle').value)+(event.key==='ArrowLeft'?-2:2)));
  else $('power').value=Math.max(140,Math.min(humanPowerLimit(),Number($('power').value)+(event.key==='ArrowDown'?-40:40)));
  updateUI();
 }
});
$('undo').addEventListener('click',()=>{
 if(moving||!history.length)return;cancelAI();cancelDrag();
 do{const previous=history.pop();stones=previous.stones;turn=previous.turn;shots=previous.shots;}while(opponentMode()==='ai'&&turn===1&&history.length);
 result=null;gameMotion=null;fadingStones=[];aiSummary='青のAIは選んだレベルに応じて投石を考えます。';updateUI();startAI();
});
function resetToSetup(){
 cancelAI();cancelDrag();gameStarted=false;matchConfig=null;gameMotion=null;powerMode=false;fadingStones=[];
 aiSummary='青のAIは選んだレベルに応じて投石を考えます。';stones=[];turn=0;shots=0;moving=false;result=null;history=[];accumulator=0;
 $('position').value=320;$('angle').value=0;$('power').value=300;
 $('setup-note').textContent='相手とレベルを選んでください。';updateUI();
}
$('start-game').addEventListener('click',()=>{
 if(gameStarted)return;
 matchConfig=Object.freeze({opponent:$('opponent').value,level:Number($('ai-level').value)});
 gameStarted=true;updateUI();startAI();
});
$('power-mode').addEventListener('click',()=>{
 if(!gameStarted||moving||result||isAITurn()||drag)return;
 powerMode=!powerMode;$('power').value=Math.min(humanPowerLimit(),Number($('power').value));updateUI();
});
$('restart').addEventListener('click',resetToSetup);
function setupChanged(){
 if(gameStarted){$('opponent').value=matchConfig.opponent;$('ai-level').value=matchConfig.level;return;}
 updateUI();
}
$('opponent').addEventListener('change',setupChanged);
$('ai-level').addEventListener('change',setupChanged);
window.addEventListener('pagehide',cancelAI);
window.addEventListener('pageshow',startAI);
function frame(time){
 if(lastTime===null)lastTime=time;const elapsed=Math.min((time-lastTime)/1000,.05);lastTime=time;
 fadingStones=fadingStones.filter(s=>(s.age+=elapsed)<.65);
 if(moving){accumulator+=elapsed;while(accumulator>=1/120&&moving){physics(1/120);accumulator-=1/120;}}
 draw();requestAnimationFrame(frame);
}
updateUI();requestAnimationFrame(frame);
</script>
</body>
</html>
