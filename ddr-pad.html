<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>DDR NOTE PAD</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #11151d;
      --panel-2: #171c26;
      --line: #2a3140;
      --ink: #f5f7fb;
      --muted: #8f98aa;
      --accent: #d7ff3f;
      --accent-ink: #101500;
      --arrow: #eef2f8;
      --cell: clamp(54px, 17vw, 78px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -10%, rgba(215, 255, 63, .12), transparent 35rem),
        var(--bg);
      font-family: Inter, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      padding: clamp(18px, 4vw, 42px) 14px 64px;
    }

    main {
      width: min(580px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 8vw, 48px);
      line-height: .95;
      letter-spacing: -.045em;
    }

    .count {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: var(--panel-2);
      padding: 8px 13px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { border-color: #505b70; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button.primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
    button.danger { margin-left: auto; color: #ff9c9c; }

    .chart {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .32);
    }

    .labels, .row {
      display: grid;
      grid-template-columns: 36px repeat(4, var(--cell));
      justify-content: center;
    }

    .labels {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(17, 21, 29, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .label {
      display: grid;
      place-items: center;
      height: 42px;
      color: var(--muted);
      font-size: 21px;
      font-weight: 800;
    }

    .row {
      border-bottom: 1px solid var(--line);
    }

    .row:last-child { border-bottom: 0; }
    .row:nth-child(4n + 1) { border-top: 2px solid #596274; }

    .row-number {
      display: grid;
      place-items: center;
      color: #697386;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .step {
      position: relative;
      width: var(--cell);
      height: var(--cell);
      padding: 0;
      border: 0;
      border-left: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: transparent;
      font-size: clamp(36px, 11vw, 52px);
      line-height: 1;
    }

    .step::after {
      content: attr(data-arrow);
      display: grid;
      place-items: center;
      position: absolute;
      inset: 7px;
      border: 1px solid transparent;
      border-radius: 9px;
      opacity: 0;
      transform: scale(.72);
      transition: opacity .1s ease, transform .12s ease;
    }

    .step[aria-pressed="true"]::after {
      color: var(--arrow);
      background: #252c39;
      border-color: #4a5568;
      opacity: 1;
      transform: scale(1);
      text-shadow: 0 2px 12px rgba(255,255,255,.18);
    }

    .step:hover { background: rgba(255,255,255,.025); }
    .step:focus-visible { outline-offset: -4px; }

    .hint {
      margin: 13px 4px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 5;
      translate: -50% 12px;
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--accent-ink);
      background: var(--accent);
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
    }

    .toast.show { opacity: 1; translate: -50% 0; }

    @media (max-width: 410px) {
      body { padding-inline: 8px; }
      .labels, .row { grid-template-columns: 28px repeat(4, var(--cell)); }
      .toolbar button { flex: 1; padding-inline: 8px; }
      button.danger { margin-left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">STEP CHART SKETCH</p>
        <h1>DDR NOTE PAD</h1>
      </div>
      <p class="count"><span id="rowCount">16</span> rows</p>
    </header>

    <div class="toolbar" aria-label="譜面の操作">
      <button type="button" id="addRows">＋ 4行</button>
      <button type="button" id="removeRows">− 4行</button>
      <button type="button" class="primary" id="copyChart">譜面をコピー</button>
      <button type="button" class="danger" id="clearChart">全消去</button>
    </div>

    <section class="chart" aria-label="DDR譜面">
      <div class="labels" aria-hidden="true">
        <span></span><span class="label">←</span><span class="label">↓</span><span class="label">↑</span><span class="label">→</span>
      </div>
      <div id="grid"></div>
    </section>
    <p class="hint">マスを押すと矢印をON / OFFできます。コピー結果はそのままチャットに貼れます。</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const arrows = ["←", "↓", "↑", "→"];
    const grid = document.querySelector("#grid");
    const rowCount = document.querySelector("#rowCount");
    const toast = document.querySelector("#toast");
    let rows = 16;
    let notes = Array.from({ length: rows }, () => [false, false, false, false]);
    let toastTimer;

    function render() {
      grid.replaceChildren();
      notes.forEach((note, rowIndex) => {
        const row = document.createElement("div");
        row.className = "row";

        const number = document.createElement("span");
        number.className = "row-number";
        number.textContent = rowIndex + 1;
        row.append(number);

        arrows.forEach((arrow, columnIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "step";
          button.dataset.arrow = arrow;
          button.setAttribute("aria-pressed", String(note[columnIndex]));
          button.setAttribute("aria-label", `${rowIndex + 1}行目 ${arrow}`);
          button.addEventListener("click", () => {
            notes[rowIndex][columnIndex] = !notes[rowIndex][columnIndex];
            button.setAttribute("aria-pressed", String(notes[rowIndex][columnIndex]));
          });
          row.append(button);
        });
        grid.append(row);
      });
      rows = notes.length;
      rowCount.textContent = rows;
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1700);
    }

    document.querySelector("#addRows").addEventListener("click", () => {
      notes.push(...Array.from({ length: 4 }, () => [false, false, false, false]));
      render();
    });

    document.querySelector("#removeRows").addEventListener("click", () => {
      if (notes.length <= 4) return showToast("これ以上は減らせません");
      notes.splice(-4);
      render();
    });

    document.querySelector("#clearChart").addEventListener("click", () => {
      notes = notes.map(() => [false, false, false, false]);
      render();
      showToast("譜面を消去しました");
    });

    document.querySelector("#copyChart").addEventListener("click", async () => {
      const lastActive = notes.reduce((last, row, index) => row.some(Boolean) ? index : last, -1);
      const end = Math.max(lastActive + 1, 4);
      const text = notes.slice(0, end)
        .map(row => row.map((active, index) => active ? arrows[index] : "　").join(""))
        .join("\n");
      try {
        await navigator.clipboard.writeText(text);
        showToast("譜面をコピーしました");
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.append(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        showToast("譜面をコピーしました");
      }
    });

    render();
  </script>
</body>
</html>
